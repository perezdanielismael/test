<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CTA Reporting</title>
</head>

<body>

  <h2>HubSpot CTA Reporting</h2>

  <label>Base URL del servidor</label><br>
  <input id="base-url" value="https://test-v8qp.onrender.com" style="width:400px;"><br><br>

  <label>ID del CTA</label><br>
  <input id="cta-id" placeholder="Ej: 197697674877" style="width:400px;"><br><br>

  <label>Filtrar por URL (opcional)</label><br>
  <input id="filter-url" placeholder="https://midominio.com/pagina" style="width:400px;"><br><br>

  <button onclick="callCta()">Consultar</button>

  <pre id="result"></pre>

  <script>
    async function callCta() {
      const base = document.getElementById("base-url").value.trim();   // ✔ Declarada ANTES del uso
      const ctaId = document.getElementById("cta-id").value.trim();
      const filterUrl = document.getElementById("filter-url").value.trim();

      if (!base || !ctaId) {
        alert("Colocá la Base URL y el CTA ID");
        return;
      }

      let endpoint = `${base}/cta/${ctaId}`;
      if (filterUrl) {
        endpoint += `?url=${encodeURIComponent(filterUrl)}`;
      }

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("result").textContent = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
